<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL - World Chat</title>
    <link rel="stylesheet" href="../css/variables.css?v=1.0.1">
    <link rel="stylesheet" href="../css/reset.css?v=1.0.1">
    <link rel="stylesheet" href="../css/global.css?v=1.0.1">
    <link rel="stylesheet" href="../css/layout.css?v=1.0.1">
    <link rel="stylesheet" href="../css/components.css?v=1.0.1">
    <link rel="stylesheet" href="../css/animations.css?v=1.0.1">
    <link rel="stylesheet" href="../css/responsive.css?v=1.0.1">
    <style>
        .ai-monitoring-badge {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--color-accent);
            border: 1px solid rgba(6, 182, 212, 0.25);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            animation: glow 2s infinite alternate;
        }
    </style>
</head>
<body class="theme-light">

    <div class="app-layout">
        
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="logo-container">
                    <div class="logo-icon">🛡️</div>
                    <div class="logo-text" style="color: var(--text-primary-light);">SENTINEL</div>
                </div>
                <nav class="nav-links">
                    <a href="world-feed.html" class="nav-item">
                        <span>📰</span> World Feed
                    </a>
                    <a href="world-chat.html" class="nav-item active">
                        <span>💬</span> World Chat
                    </a>
                    <a href="dashboard.html" class="nav-item">
                        <span>📊</span> My Dashboard
                    </a>
                    <a href="report.html" class="nav-item">
                        <span>✍️</span> Report Incident
                    </a>
                    <a href="fact-check.html" class="nav-item">
                        <span>🔍</span> Fact Checker
                    </a>
                </nav>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="card" style="padding: 0.8rem; display: flex; align-items: center; gap: 0.75rem;">
                    <div class="avatar" style="width: 32px; height: 32px;">U</div>
                    <div style="font-size: 0.85rem;">
                        <h5 id="header-username">@civilian</h5>
                        <span class="text-muted" style="font-size: 0.7rem;">Citizen Account</span>
                    </div>
                </div>
                <a href="login.html" class="btn btn-secondary" style="font-size: 0.85rem;">
                    🏛️ Government Admin Portal
                </a>
            </div>
        </aside>

        <!-- MAIN WINDOW -->
        <div class="main-content">
            
            <header class="app-header">
                <div>
                    <h2 style="font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                        World Chat
                        <span style="font-size:0.8rem; font-weight:400;" class="text-muted">(124 Online)</span>
                    </h2>
                    <span class="text-muted" style="font-size: 0.8rem;">Live civic communication and active crisis coordination logs.</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button id="mobile-menu-toggle" class="btn btn-secondary" style="padding: 0.5rem; display: none;">☰</button>
                    <div class="ai-monitoring-badge">
                        🟢 AI CONTENT MONITORING ACTIVE
                    </div>
                </div>
            </header>

            <div class="content-body">
                
                <div class="chat-container card">
                    
                    <!-- Chat Messages List -->
                    <div class="chat-messages" id="chat-messages-container">
                        <!-- Messages dynamically added by JavaScript -->
                    </div>
                    
                    <!-- Typing Indicator -->
                    <div id="typing-indicator" class="text-muted" style="font-size: 0.8rem; padding: 0.25rem 1.5rem; height: 20px; font-style: italic;">
                        <!-- e.g. "admin is typing..." -->
                    </div>
                    
                    <!-- Chat Input Section -->
                    <div class="chat-input-area" style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-color-light); display: flex; flex-direction: column; gap: 0.5rem;">
                        <div id="chat-upload-preview" style="display: none; align-items: center; gap: 0.5rem; justify-content: space-between; font-size: 0.75rem; padding: 0.4rem 0.8rem; background: rgba(255,255,255,0.03); border-radius: var(--border-radius-sm); border: 1px solid rgba(255,255,255,0.05);">
                            <span id="chat-upload-filename" class="text-muted" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 250px;">No photo selected</span>
                            <button id="btn-remove-chat-upload" style="background: none; border: none; color: var(--color-danger); cursor: pointer; font-weight: 700; font-size: 1.1rem; padding: 0 0.5rem;">×</button>
                        </div>
                        <div style="display: flex; gap: 0.75rem; align-items: center; width: 100%;">
                            <input type="text" id="chat-message-input" class="chat-input" placeholder="Type a message to the public channel..." style="flex: 1;">
                            
                            <label for="chat-file-input" class="btn btn-secondary" style="padding: 0.6rem 1rem; margin: 0; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; white-space: nowrap; height: auto;">
                                📷 <span data-i18n="upload_photo">Upload Photo</span>
                            </label>
                            <input type="file" id="chat-file-input" accept="image/*" style="display: none;">
                            
                            <button id="btn-send-chat" class="btn btn-primary" style="padding: 0.6rem 1.5rem; font-size: 0.85rem;" data-i18n="send_btn">Send</button>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/i18n.js?v=1.0.1"></script>
    <script src="../js/api.js?v=1.0.1"></script>
    <script src="../js/websocket.js?v=1.0.1"></script>
    <script src="../js/ui.js?v=1.0.1"></script>
    <script src="../js/chat.js?v=1.0.1"></script>
</body>
</html>
