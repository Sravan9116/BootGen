<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL - World Chat</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .ai-monitoring-badge {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--color-accent);
            border: 1px solid rgba(6, 182, 212, 0.25);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            animation: glow 2s infinite alternate;
        }
    </style>
</head>
<body class="theme-light">

    <div class="app-layout">
        
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="logo-container">
                    <div class="logo-icon">🛡️</div>
                    <div class="logo-text" style="color: var(--text-primary-light);">SENTINEL</div>
                </div>
                <nav class="nav-links">
                    <a href="/pages/world-feed.html" class="nav-item">
                        <span>📰</span> World Feed
                    </a>
                    <a href="/pages/world-chat.html" class="nav-item active">
                        <span>💬</span> World Chat
                    </a>
                    <a href="/pages/dashboard.html" class="nav-item">
                        <span>📊</span> My Dashboard
                    </a>
                    <a href="/pages/report.html" class="nav-item">
                        <span>✍️</span> Report Incident
                    </a>
                    <a href="/pages/fact-check.html" class="nav-item">
                        <span>🔍</span> Fact Checker
                    </a>
                </nav>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="card" style="padding: 0.8rem; display: flex; align-items: center; gap: 0.75rem;">
                    <div class="avatar" style="width: 32px; height: 32px;">U</div>
                    <div style="font-size: 0.85rem;">
                        <h5 id="header-username">@civilian</h5>
                        <span class="text-muted" style="font-size: 0.7rem;">Citizen Account</span>
                    </div>
                </div>
                <a href="/pages/login.html" class="btn btn-secondary" style="font-size: 0.85rem;">
                    🏛️ Government Admin Portal
                </a>
            </div>
        </aside>

        <!-- MAIN WINDOW -->
        <div class="main-content">
            
            <header class="app-header">
                <div>
                    <h2 style="font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                        World Chat
                        <span style="font-size:0.8rem; font-weight:400;" class="text-muted">(124 Online)</span>
                    </h2>
                    <span class="text-muted" style="font-size: 0.8rem;">Live civic communication and active crisis coordination logs.</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button id="mobile-menu-toggle" class="btn btn-secondary" style="padding: 0.5rem; display: none;">☰</button>
                    <div class="ai-monitoring-badge">
                        🟢 AI CONTENT MONITORING ACTIVE
                    </div>
                </div>
            </header>

            <div class="content-body">
                
                <div class="chat-container card">
                    
                    <!-- Chat Messages List -->
                    <div class="chat-messages" id="chat-messages-container">
                        <!-- Messages dynamically added by JavaScript -->
                    </div>
                    
                    <!-- Typing Indicator -->
                    <div id="typing-indicator" class="text-muted" style="font-size: 0.8rem; padding: 0.25rem 1.5rem; height: 20px; font-style: italic;">
                        <!-- e.g. "admin is typing..." -->
                    </div>
                    
                    <!-- Chat Input Section -->
                    <div class="chat-input-area" style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-color-light);">
                        <input type="text" id="chat-message-input" class="chat-input" placeholder="Type a message to the public channel...">
                        
                        <select id="chat-mock-image" class="form-control" style="width: auto; font-size: 0.8rem; padding: 0.5rem; height: auto;">
                            <option value="">Attach photo...</option>
                            <option value="/assets/images/flood.jpg">Flooded Road</option>
                            <option value="/assets/images/accident.jpg">Car Accident</option>
                        </select>
                        
                        <button id="btn-send-chat" class="btn btn-primary" style="padding: 0.75rem 2rem;">Send</button>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
